name: Test and Deploy to Staging

on:
  push:
    branches: ['staging']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Create .env.staging file from secret
        run: echo "${{ secrets.ENV_STAGING_FILE }}" > .env.staging

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          file: Dockerfile.staging
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          platforms: linux/amd64

      - name: Remove untagged images from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          # Tentukan scope API (orgs/... atau users/...)
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            SCOPE="orgs/${OWNER}"
          else
            SCOPE="users/${OWNER}"
          fi

          # Pastikan jq tersedia
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

          echo "Listing untagged versions for ghcr.io/${OWNER}/${PACKAGE} ..."
          # --paginate untuk ambil semua halaman
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "/${SCOPE}/packages/container/${PACKAGE}/versions?per_page=100" \
          | jq -r '.[] | select(.metadata.container.tags | length == 0) | .id' \
          | while read -r VID; do
              echo "Deleting version id: ${VID}"
              gh api --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/${SCOPE}/packages/container/${PACKAGE}/versions/${VID}"
            done

          echo "Done removing untagged images."

  deploy:
    runs-on: self-hosted
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e

            echo "Pulling latest image..."
            docker pull ghcr.io/${{ github.repository }}:staging

            echo "Stopping super-app-fe-staging if running..."
            docker stop super-app-fe-staging || true
            docker rm super-app-fe-staging || true

            docker run -d --name super-app-fe-staging -p 8001:80 ghcr.io/${{ github.repository }}:staging

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment complete."
